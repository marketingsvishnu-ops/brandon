<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Notification Poster</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .poster {
      width: 90%;
      max-width: 700px;
      padding: 50px 40px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 15px;
      color: #222;
    }

    p {
      font-size: 20px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 14px 30px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .notice {
      margin-top: 25px;
      padding: 15px;
      background: #eff6ff;
      border-radius: 10px;
      color: #1e40af;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="poster">
    <div class="icon">🔔</div>

    <h1>Important Notification</h1>

    <p>
      We have an important update for you.
      Please visit our website to view the latest information.
    </p>

    <a href="#" class="btn">View Notification</a>

    <div class="notice">
      📢 Stay updated with our latest announcements and news.
    </div>
  </div>

</body>
</html>
